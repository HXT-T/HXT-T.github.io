<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <meta name="description" content="yuyuyuu 的博客 —— 哲学、技术、阅读与生活" />
    <meta name="theme-color" content="#0e0b0d" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // 默认夜樱（深色）；访客选过浅色就沿用。放在最前面，避免首屏闪白
      try {
        var t = localStorage.getItem('theme')
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
        if (t === 'light') document.querySelector('meta[name="theme-color"]').content = '#f8f4f1'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <link rel="canonical" href="https://hxt-t.github.io/blog" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="yuyuyuu · Personal Internet" />
    <meta property="og:title" content="博客 · yuyuyuu" />
    <meta property="og:description" content="哲学、技术、阅读与生活里的长思考。" />
    <meta property="og:url" content="https://hxt-t.github.io/blog" />
    <meta property="og:image" content="https://hxt-t.github.io/hero-bg.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
